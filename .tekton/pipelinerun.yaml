apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: "serverless-martedi-run-"
  namespace: "bs-team-alpha-dev"
  labels:
    tekton.dev/pipeline: "serverless-martedi-pipeline"
    app.kubernetes.io/name: "serverless-martedi"
    app.kubernetes.io/part-of: "serverless-martedi"
    owner: so.amin
    janus-idp.io/tekton: "serverless-martedi"
spec:
  pipelineRef:
    name: "serverless-martedi-pipeline"
  taskRunTemplate:
    serviceAccountName: tekton-pipeline
  serviceAccountName: tekton-pipeline
  params:
    - name: repo-url
      value: "https://github.com/{{ owner }}/{{ repo }}.git"
    - name: revision
      value: main
    - name: service-name
      value: "serverless-martedi"
    - name: environment
      value: "dev"
    - name: aws-region
      value: "eu-west-1"
    - name: stack-name
      value: "serverless-martedi-dev"
    - name: runtime
      value: "nodejs22.x"
    - name: namespace
      value: "bs-team-alpha-dev"
    - name: service-account-name
      value: tekton-pipeline
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: "serverless-martedi-dev-workspace"
